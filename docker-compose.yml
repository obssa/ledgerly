# Local development stack. `docker compose up -d`, then see README.md "Run it".
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ledgerly_owner          # owns the tables, runs migrations (bypasses RLS)
      POSTGRES_PASSWORD: ledgerly_owner
      POSTGRES_DB: ledgerly
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly_owner -d ledgerly"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: local-dev-master-key
    ports: ["7700:7700"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ledgerly
      MINIO_ROOT_PASSWORD: ledgerly-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./apps/api:/var/www/html"]

  worker:
    build: ./apps/api
    command: php artisan horizon
    env_file: ./apps/api/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on: [api]
    volumes: ["./apps/api:/var/www/html"]

volumes:
  pgdata:
  miniodata:
