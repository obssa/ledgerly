; Ledgerly API, production PHP settings (on top of php.ini-production).
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 10M   ; SECURITY.md S7: 10 MB file limit
post_max_size = 12M

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; code never changes inside a running image
opcache.jit = tracing
opcache.jit_buffer_size = 64M
