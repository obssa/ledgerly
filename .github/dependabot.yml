# Weekly dependency updates, grouped so they arrive as a few reviewable pull requests that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: composer
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      laravel: { patterns: ["laravel/*"] }
      dev: { dependency-type: development }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      next-react: { patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"] }
      dev: { dependency-type: development }

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly }
