# Continuous delivery and deployment. Every commit on main that passed CI:
#
#   images  → ghcr.io/<owner>/ledgerly-{api,web}:<sha>, with provenance and SBOM (for a container host later)
#   bundle  → one release archive: the API with production packages, the web app as a Next.js standalone server
#   cpanel  → https://app.evenbooks.net (web) and https://api.evenbooks.net (API) on the cPanel
#             account: upload, migrate as the owner, check the database roles, switch, smoke test, roll back on
#             failure. Skipped until the repository variable DEPLOY_ENABLED is "true" (docs/runbook/cpanel.md).
#
# Secrets:   DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_DB_OWNER_PASSWORD
# Variables: DEPLOY_ENABLED, DEPLOY_PHP_BIN, DEPLOY_WEB_URL, DEPLOY_API_URL
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:     # rebuild the current main by hand

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never interrupt a half-pushed release

permissions:
  contents: read

jobs:
  images:
    # Only a CI run on a push to main (not a pull request that happens to target main), and only if it passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # sign the provenance attestation
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, context: apps/api, dockerfile: apps/api/Dockerfile.production }
          - { name: web, context: apps/web, dockerfile: apps/web/Dockerfile }
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/ledgerly-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.SHA }}' }   # the commit CI tested, not whatever main is now
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        # GitHub stores attestations only for public repositories (or organisation plans). The image still
        # carries its own provenance and SBOM (above); this adds the signed, GitHub-verifiable record.
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke test the image
        if: matrix.name == 'web'
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE:$SHA"
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ | grep -q "Demo mode"   # no API configured: demo mode, decided at run time
          [ "$(docker exec smoke id -u)" != "0" ]                   # never runs as root
      - name: Summary
        run: echo "- \`$IMAGE:$SHA\` (${{ steps.build.outputs.digest }})" >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: build the release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.SHA }}' }
      - id: sha
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_pgsql, bcmath, intl, tools: 'composer:v2', coverage: none }   # the cPanel account runs PHP 8.3
      - name: API with production packages only
        working-directory: apps/api
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }   # the server runs Node 22
      - name: Web app as a standalone Node.js server
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Assemble the release archive
        run: |
          mkdir -p bundle/api bundle/web/.next bundle/web/public
          rsync -a apps/api/ bundle/api/ --exclude=tests/ --exclude=storage/ --exclude='.env*' --exclude='phpunit*.xml' \
            --exclude='Dockerfile*' --exclude=docker/ --exclude=.dockerignore --exclude=.phpunit.result.cache
          cp -r apps/web/.next/standalone/. bundle/web/
          cp -r apps/web/.next/static bundle/web/.next/static
          [ -d apps/web/public ] && cp -r apps/web/public/. bundle/web/public/ || true
          echo "$SHA" > bundle/REVISION
          tar -czf "ledgerly-$SHA.tar.gz" -C bundle .
          du -h "ledgerly-$SHA.tar.gz"
      - uses: actions/upload-artifact@v7
        with: { name: release, path: 'ledgerly-${{ env.SHA }}.tar.gz', retention-days: 14 }

  cpanel:
    name: deploy to app.evenbooks.net
    needs: bundle
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: live
      url: ${{ vars.DEPLOY_WEB_URL || 'https://app.evenbooks.net' }}
    env:
      SHA: ${{ needs.bundle.outputs.sha }}
      PHP_BIN: ${{ vars.DEPLOY_PHP_BIN || '/opt/alt/php83/usr/bin/php' }}
      WEB_URL: ${{ vars.DEPLOY_WEB_URL || 'https://app.evenbooks.net' }}
      API_URL: ${{ vars.DEPLOY_API_URL || 'https://api.evenbooks.net' }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.SHA }}' }   # the deploy scripts of the release being deployed
      - uses: actions/download-artifact@v8
        with: { name: release }
      - name: SSH with a pinned host key
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN_HOSTS" \
            || { echo "Deploy secrets are incomplete (docs/runbook/cpanel.md)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n' \
            "$HOST" "$PORT" "$USER" > ~/.ssh/config
      - name: Upload the release and the deploy scripts
        run: |
          ssh target 'mkdir -p ~/ledgerly/incoming ~/ledgerly/deploy ~/ledgerly-web'
          scp "ledgerly-$SHA.tar.gz" target:ledgerly/incoming/
          scp scripts/deploy/cpanel/*.sh scripts/deploy/cpanel/web-app.js target:ledgerly/deploy/
          ssh target 'cp ~/ledgerly/deploy/web-app.js ~/ledgerly-web/app.js'
      - name: Migrate, check database roles, switch
        id: switch
        env:
          OWNER_PASSWORD: ${{ secrets.DEPLOY_DB_OWNER_PASSWORD }}
          DEMO_LOGINS: ${{ vars.DEMO_LOGINS }}   # true turns on demo sign-in (config/demo.php), false turns it off
        run: |
          test -n "$OWNER_PASSWORD" || { echo "DEPLOY_DB_OWNER_PASSWORD is not set"; exit 1; }
          case "$DEMO_LOGINS" in true|false|'') ;; *) echo "DEMO_LOGINS must be true or false"; exit 1 ;; esac
          # The owner password goes over stdin only: never into a file or a command line on the server.
          printf '%s\n' "$OWNER_PASSWORD" | ssh target "PHP_BIN='$PHP_BIN' DEMO_LOGINS='$DEMO_LOGINS' bash ~/ledgerly/deploy/release.sh '$SHA'"
      - name: Smoke test the live site
        run: bash scripts/deploy/cpanel/smoke.sh "$WEB_URL" "$API_URL"
      - name: Roll back
        if: failure() && steps.switch.outcome == 'success'
        run: ssh target "PHP_BIN='$PHP_BIN' bash ~/ledgerly/deploy/rollback.sh"
      - name: Summary
        if: always()
        run: |
          { echo "### app.evenbooks.net"; echo "- Release: \`$SHA\`"; echo "- Web: $WEB_URL"; echo "- API: $API_URL"; echo "- Result: ${{ job.status }}"; } >> "$GITHUB_STEP_SUMMARY"
