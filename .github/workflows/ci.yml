# Nothing merges unless every layer passes: database guards, API unit and feature tests, web tests and build.
name: ci
on:
  push: { branches: [main] }
  pull_request:

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    strategy: { matrix: { postgres: [13, 16, 18] } }   # 13 is the cPanel host; 18 is the target for a dedicated server
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_USER: ledgerly_owner, POSTGRES_PASSWORD: ledgerly_owner, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ledgerly_owner" --health-interval 5s --health-retries 20
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: ledgerly_owner, PGPASSWORD: ledgerly_owner }
    steps:
      - uses: actions/checkout@v5
      - name: Schema, guard tests and concurrency tests
        run: |
          bash apps/api/database/schema/tests/run.sh | tee result.txt
          ! grep -E "FAIL|ERROR" result.txt
          grep -q "PASS C4" result.txt

  api:
    runs-on: ubuntu-latest
    strategy: { matrix: { php: ['8.3', '8.4'] } }   # 8.3 is the cPanel account (shared with bakery-ops); 8.4 the container image
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: ledgerly_owner, POSTGRES_PASSWORD: ledgerly_owner, POSTGRES_DB: ledgerly }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ledgerly_owner" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: apps/api } }
    # Only the host comes from here. phpunit.xml fixes the roles: the schema is built as ledgerly_owner and
    # every request runs as ledgerly_web, so row-level security applies in the tests (SECURITY.md S1).
    env: { DB_HOST: localhost, PGHOST: localhost, PGUSER: ledgerly_owner, PGPASSWORD: ledgerly_owner }
    steps:
      - uses: actions/checkout@v5
      - name: Database roles, exactly as in local development (creates ledgerly_test)
        run: psql -d ledgerly -v ON_ERROR_STOP=1 -f ../../docker/postgres/init.sql
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: pdo_pgsql, bcmath, intl, coverage: none }
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Known vulnerabilities in PHP packages
        run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - name: Unit and feature tests (feature tests run on PostgreSQL as ledgerly_web)
        run: php artisan test

  api-shared-host:
    # The production host is cPanel shared hosting: PostgreSQL 13, logins that cannot create roles, a public
    # schema anyone may write. Same role layout here (shared-host-roles.sql); every feature test runs as the
    # restricted login with the tables in their own schema.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: apps/api } }
    env: { DB_HOST: localhost, DB_SCHEMA: ledgerly, DB_APP_ROLE: cp_lweb, PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v5
      - name: cPanel-style roles and database
        run: psql -d postgres -v ON_ERROR_STOP=1 -f database/schema/tests/shared-host-roles.sql
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_pgsql, bcmath, intl, coverage: none }   # what the cPanel account runs
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Feature tests as cp_lweb, tables in schema ledgerly
        run: |
          sed -e 's/value="ledgerly_test"/value="cp_ledgerly_test"/g' -e 's/value="ledgerly_web"/value="cp_lweb"/g'               -e 's/value="ledgerly_owner"/value="cp_lowner"/g' phpunit.xml > phpunit.shared-host.xml
          vendor/bin/phpunit -c phpunit.shared-host.xml --testsuite Feature

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Known vulnerabilities in JavaScript packages
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  images:
    # The production images build on every pull request (not pushed), so a broken Dockerfile never reaches main.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: apps/api, dockerfile: apps/api/Dockerfile.production }
          - { name: web, context: apps/web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
