# Nothing merges unless every layer passes: database guards, API unit and feature tests, web tests and build.
name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    strategy: { matrix: { postgres: [16, 18] } }   # 16 is the oldest supported; 18 is production
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_USER: ledgerly_owner, POSTGRES_PASSWORD: ledgerly_owner, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ledgerly_owner" --health-interval 5s --health-retries 20
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: ledgerly_owner, PGPASSWORD: ledgerly_owner }
    steps:
      - uses: actions/checkout@v4
      - name: Schema, guard tests and concurrency tests
        run: |
          bash apps/api/database/schema/tests/run.sh | tee result.txt
          ! grep -E "FAIL|ERROR" result.txt
          grep -q "PASS C4" result.txt

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: ledgerly_owner, POSTGRES_PASSWORD: ledgerly_owner, POSTGRES_DB: ledgerly_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ledgerly_owner" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: apps/api } }
    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_DATABASE: ledgerly_test
      DB_USERNAME: ledgerly_owner      # migrations run as the owner
      DB_PASSWORD: ledgerly_owner
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: pdo_pgsql, bcmath, coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - name: Known vulnerabilities in PHP packages
        run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - name: Unit and feature tests (feature tests run on PostgreSQL)
        run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Known vulnerabilities in JavaScript packages
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
